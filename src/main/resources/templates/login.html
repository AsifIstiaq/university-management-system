<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<main class="container login-box">
    <div class="card">
        <h1>University Management System</h1>
        <p class="hint">Sign in to your Admin, Teacher or Student panel.</p>

        <div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
        <div class="alert alert-success" th:if="${param.deleted}">Your account has been deleted.</div>

        <form class="form" th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</main>
</body>
</html>
