<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <div class="page-header">
        <h1>My Profile <span class="badge" th:text="${account.role}">ROLE</span></h1>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <dl class="profile-grid">
            <dt>Username</dt><dd th:text="${account.username}">username</dd>
            <dt>Full name</dt><dd th:text="${account.fullName}">Name</dd>
            <dt>Email</dt><dd th:text="${account.email}">email</dd>
            <dt>Phone</dt><dd th:text="${account.phone} ?: '-'">-</dd>

            <th:block th:if="${panel == 'teacher'}">
                <dt>Department</dt><dd th:text="${account.department}">Dept</dd>
                <dt>Designation</dt><dd th:text="${account.designation} ?: '-'">-</dd>
            </th:block>

            <th:block th:if="${panel == 'student'}">
                <dt>Roll</dt><dd th:text="${account.roll}">Roll</dd>
                <dt>Department</dt><dd th:text="${account.department}">Dept</dd>
                <dt>Semester</dt><dd th:text="${account.semester} ?: '-'">-</dd>
            </th:block>
        </dl>

        <div class="actions-row">
            <a class="btn" th:href="@{/{p}/profile/edit(p=${panel})}">Edit Profile</a>
            <form th:action="@{/{p}/profile/delete(p=${panel})}" method="post"
                  onsubmit="return confirm('Permanently delete your account? This cannot be undone.');">
                <button type="submit" class="btn btn-danger">Delete My Account</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
