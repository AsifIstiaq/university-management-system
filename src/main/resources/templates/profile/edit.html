<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <div class="card">
        <h2>Edit My Profile</h2>
        <p class="hint">Academic details (department, roll, semester) can only be changed by an administrator.</p>

        <form class="form" th:object="${profile}" method="post" th:action="@{/{p}/profile(p=${panel})}">
            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" th:field="*{fullName}">
                <span class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="text" id="email" th:field="*{email}">
                <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}">
                <span class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>
            <div class="field">
                <label for="password">New password</label>
                <input type="password" id="password" th:field="*{password}">
                <span class="hint">Leave blank to keep your current password.</span>
                <span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <button type="submit" class="btn">Save</button>
            <a class="btn btn-secondary" th:href="@{/{p}/profile(p=${panel})}">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
